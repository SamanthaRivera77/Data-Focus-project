<!DOCTYPE html>
<html>
    <head>
        <title> My Weather Data  Project</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1> My Data Visualization Project</h1>
       <canvas id="myChart" width="400" height="200"></canvas>
         <script src="script.js"></script>   
    </body>
</html>

fetch('data/Weather Data - Sheet1.csv')
  .then(response => response.text())
  .then(csv => {
    const rows = csv.split('\n').slice(1);

    const labels = [];
    const values = [];

    rows.forEach(row => {
      const cols = row.split(',');

      if (cols.length >= 2) {
        labels.push(cols[0]);
        values.push(parseFloat(cols[1]));
      }
    });

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Weather data',
          data: values,
          borderWidth: 2
        }]
        },
options: {
  responsive: true,
  plugins: {
    title: {
      display: true,
      text: 'Weather in New York'
    }
  },
  scales: {
    x: {
      title: {
        display: true,
        text: 'Dates'
      }
    },
    y: {
      title: {
        display: true,
        text: 'Temperature (Fahrenheit)'
      }
    }
body {
  font-family: Arial, sans-serif;
  background-color: #ff990b;
  text-align: center;
}

canvas {
  max-width: 800px;
  margin: 40px auto;
  display: block;

}button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background-color: #0f8e64;
  color: black;
}
button:active {
  transform: scale(0.98);
}   
button:focus {
  outline: none;
  box-shadow: 0 0 5px #2a1caa;
}
