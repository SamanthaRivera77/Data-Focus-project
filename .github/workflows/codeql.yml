const ctx = document.getElementById('myChart').getContext('2d');

fetch('data/Weather Data - Sheet1.csv')
  .then(response => response.text())
  .then(csv => {
    const rows = csv.split('\n').slice(1);

    const labels = [];
    const values = [];

    rows.forEach(row => {
      const cols = row.split(',');

      if (cols.length >= 2) {
        labels.push(cols[0]);              // Date
        values.push(parseFloat(cols[1]));  // Weather value
      }
    });

    new Chart(ctx, {
      type: 'line'
      data: {
        labels: labels,
        datasets: [{
          label: 'Weather Data',
          data: values,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Weather in New York'
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Dates'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Temperature (Fahrenheit)'
            }
          }
        }
      }
    });
  });
